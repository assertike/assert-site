{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block description %}{{ text }}{% endblock %}
{% block head_extra %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<section class="page-hero page-hero-error" aria-labelledby="page-title">
  <div class="grid-lines" aria-hidden="true"></div>
  <div class="wrap">
    <p class="eyebrow">Error {{ code }}</p>
    <p class="error-code" aria-hidden="true">{{ code }}</p>
    <h1 id="page-title" class="page-title">{{ title }}</h1>
    <div class="page-hero-foot">
      <p class="page-lede">{{ text }}</p>
      <div class="actions">
        <a class="btn btn-primary btn-lg" href="/">Go to the homepage</a>
        <a class="btn btn-ghost btn-lg" href="/contact/">Contact us</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
