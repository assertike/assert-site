{% extends "admin/base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<header class="page-head"><div><p class="kicker">Signed in as {{ session.user.username }}</p><h1>Account</h1></div></header>
<section class="panel narrow" aria-labelledby="pw-title">
  <h2 id="pw-title">Change password</h2>
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="fi"><label for="current">Current password</label><input id="current" name="current" type="password" autocomplete="current-password" required></div>
    <div class="fi"><label for="new">New password</label><input id="new" name="new" type="password" autocomplete="new-password" minlength="10" required aria-describedby="new-hint"><p class="hint" id="new-hint">At least 10 characters. A passphrase of several words works well.</p></div>
    <div class="fi"><label for="confirm">Confirm new password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
    <button class="btn btn-primary" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
